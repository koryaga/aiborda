<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>image</title>
<style>
  :root { color-scheme: light dark; }
  /* A full-height column: content grows from the top, the input is pinned to
     the bottom — which puts it right next to the "send" button, which lives in
     the shell immediately below the frame. */
  body {
    margin: 0;
    padding: .75rem;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font: 14px/1.5 system-ui, sans-serif;
  }
  /* margin-top: auto pins the input to the bottom when there is little content;
     sticky keeps it in view when there is a lot and the page scrolls. */
  #q {
    margin-top: auto;
    position: sticky;
    bottom: 0;
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    background: Canvas;
  }
</style>
<ul id="items"></ul>
<div id="out"></div>
<div id="notes" hidden></div>
<input id="q" type="text" autocomplete="off">
<script src="image-boot.js"></script>
<script>
  createImage(document, m => parent.postMessage(m, '*')).install();
</script>
</html>
